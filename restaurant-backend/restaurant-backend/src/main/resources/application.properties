spring.application.name=restaurant-backend

# ==========================================
# MYSQL DATABASE
# ==========================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/restaurant_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ==========================================
# SERVER
# ==========================================

server.port=${PORT:8080}


# ==========================================
# JWT
# ==========================================

app.jwt.secret=${JWT_SECRET:SpiceRouteLocalDevelopmentSecretKey2026ChangeBeforeDeployment}
app.jwt.expiration-minutes=120


# ==========================================
# EMAIL / GMAIL API
# ==========================================

spring.mail.username=${MAIL_USERNAME:restaurentbookingsystem@gmail.com}


# ==========================================
# GMAIL OAUTH
# ==========================================

google.gmail.client-id=${GOOGLE_CLIENT_ID:}
google.gmail.client-secret=${GOOGLE_CLIENT_SECRET:}
google.gmail.refresh-token=${GOOGLE_REFRESH_TOKEN:}

# ==========================================
# GOOGLE LOGIN
# ==========================================

app.google.client-id=${GOOGLE_CLIENT_ID:}


# ==========================================
# FRONTEND
# ==========================================

app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}


# ==========================================
# PASSWORD RESET
# ==========================================

app.password-reset.expiration-minutes=15


# ==========================================
# RESEND - OPTIONAL
# ==========================================

resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:}